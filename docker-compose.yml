
services:
  backend:
    container_name: oder-foot-media
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "5002:5002"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5002
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      - minio

    networks:
      - app_network

  minio:
    image: docker.io/pgsty/silo:latest
    container_name: minio_du
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${adminport}:9001"
      - "${serverport}:9000"

    volumes:
      - minio_data:/data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --address ":9000" --console-address ":9001"

    networks:
      - app_network

volumes:
  minio_data:

networks:
  app_network:
    driver: bridge


services:
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: minio_du
    restart: always

    env_file:
      - .env

    ports:
      - "${adminport}:9001"
      - "${serverport}:9000"

    volumes:
      - minio_data:/data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --address ":9000" --console-address ":9001"

    networks:
      - app_network

volumes:
  minio_data:

networks:
  app_network:
